services:
  postgres:
    image: pgvector/pgvector:pg16   # PostgreSQL 16 + pgvector cai san, khong can build tay
    container_name: urbanmart-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: urbanmart
      POSTGRES_USER: urbanmart_user
      POSTGRES_PASSWORD: urbanmart_password   # doi lai mat khau that khi dung
    ports:
      - "5432:5432"
    volumes:
      - urbanmart_pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer                  # GUI quan ly DB qua trinh duyet, khong bat buoc
    container_name: urbanmart-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: urbanmart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
volumes:
  urbanmart_pgdata:
