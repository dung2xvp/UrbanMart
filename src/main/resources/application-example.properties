# Copy file nay thanh application.properties va dien lai thong tin that cua ban.
# application.properties KHONG duoc dua len Git (them vao .gitignore).

spring.datasource.url=jdbc:postgresql://localhost:5432/urbanmart
spring.datasource.username=urbanmart_user
spring.datasource.password=urbanmart_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=day-la-chuoi-bi-mat-cua-ban-can-du-dai-it-nhat-32-ky-tu-doi-thanh-gia-tri-that
jwt.expiration-ms=86400000

server.port=8080

# SMTP email for OTP. Copy application-local.properties.example to
# application-local.properties and enter your own SMTP credentials there.
# For Gmail, use an App Password, not your account password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-gmail-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=your-email@gmail.com

